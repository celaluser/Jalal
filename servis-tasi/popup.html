<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Pasif Servis Taşı</title>
<style>
 body{margin:0;width:350px;font:13px/1.4 system-ui,sans-serif;background:#2e2418;color:#f2ece4}
 main{padding:10px;display:flex;flex-direction:column;gap:8px}
 h1{font-size:14px;margin:0}
 .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 button{cursor:pointer;border:0;border-radius:6px;padding:6px 10px;background:#5a4128;color:#fff;font:inherit}
 button:hover{background:#73542f}button:disabled{opacity:.4;cursor:default}
 #run{background:#9b2c3a}#run:hover{background:#b73646}
 .lk{background:none;color:#ffd08f;padding:0 4px;font-size:12px}
 #list,#res{max-height:180px;overflow:auto;background:#1c160f;border-radius:6px;padding:4px 6px}
 #list label,#res div{display:flex;gap:4px;padding:1px 0;border-bottom:1px solid #3a2e22}#list label span{flex:1}
 input[type=number]{width:56px;background:#1c160f;color:#fff;border:1px solid #6a5134;border-radius:4px;padding:2px 4px}
 #st{white-space:pre-wrap;color:#e6dccd}small{color:#c2b29b}.warn{color:#ffb4a8}
 label{display:flex;gap:4px;align-items:center}
 .auto{color:#ffd08f}
</style></head>
<body><main>
 <h1>⇄ Pasif Servis Taşı <small id="ver"></small></h1>
 <div id="off" hidden class="warn">Bu sekmede panelin <b>/admin/services</b> sayfası açık değil.</div>
 <div id="ui">
  <div class="row"><button id="scan">Pasif servisleri bul</button></div>
  <div class="row"><label><input id="inc" type="checkbox"> Pasif kategorilerdekileri de dahil et</label></div>
  <small id="stats"></small>
  <div class="row" id="selrow" hidden><small>Not Assigned'a taşınacak:</small><button class="lk" id="all">hepsi</button><button class="lk" id="none">hiçbiri</button></div>
  <div id="list" hidden></div>
  <div class="row"><button id="run" disabled>Taşı (0)</button><button id="stop" disabled>Durdur</button></div>
  <div class="row"><label><input id="dry" type="checkbox"> Deneme modu</label><label>bir seferde <input id="batch" type="number" min="1" max="500"></label><label>en çok <input id="max" type="number" min="1" max="10000"></label></div>
  <div class="row"><label><input id="auto" type="checkbox"> Otomatik: her</label><input id="every" type="number" min="1" max="120"><label>dk yenile + taşı</label></div>
  <small id="autoInfo" class="auto"></small>
  <div id="st"></div>
  <div id="res" hidden></div>
  <div class="row"><button id="diag">Teşhisi kopyala</button></div>
 </div>
</main><script src="popup.js"></script></body></html>
