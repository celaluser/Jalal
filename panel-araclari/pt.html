<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Pasif Servis Taşı</title>
<style>
 :root{--on-ac:#ffffff;--bg:#ffffff;--sf:#f6f7f9;--sf2:#eef0f3;--bd:#e3e6ea;--tx:#111827;--mt:#6b7280;--ac:#4f46e5;--ac-sf:#eef2ff;--dn:#dc2626;--dn-sf:#fef2f2;--ok:#047857;--ok-sf:#ecfdf5;--wr:#b45309;--wr-sf:#fffbeb}
 @media (prefers-color-scheme:dark){:root{--on-ac:#0f1020;--bg:#14161b;--sf:#1b1e25;--sf2:#22262f;--bd:#2b303b;--tx:#e6e8ec;--mt:#9aa1ad;--ac:#818cf8;--ac-sf:#232544;--dn:#f87171;--dn-sf:#2c1517;--ok:#34d399;--ok-sf:#0f2a22;--wr:#fbbf24;--wr-sf:#2b2210}}
 *{box-sizing:border-box}[hidden]{display:none !important}
 body{margin:0;width:360px;font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
 main{padding:12px;display:flex;flex-direction:column;gap:10px}
 h1{display:flex;align-items:center;gap:8px;font-size:14px;margin:0;font-weight:600}h1 small{margin-left:auto;font-weight:500;font-size:11px;color:var(--mt)}
 #ui{display:flex;flex-direction:column;gap:10px}
 button{cursor:pointer;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:600 12.5px ui-sans-serif,system-ui,sans-serif}
 button:hover{background:var(--sf)}button:disabled{cursor:default;color:var(--mt);background:var(--sf)}
 button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
 #scan{width:100%;height:34px;background:var(--ac);border-color:var(--ac);color:var(--on-ac)}#scan:hover{filter:brightness(1.07)}#scan:disabled{background:var(--sf);border-color:var(--bd);color:var(--mt)}
 .main{display:flex;gap:8px}.main #run{flex:1;height:36px;background:var(--ac);border-color:var(--ac);color:var(--on-ac)}.main #run.real{background:var(--dn);border-color:var(--dn);color:var(--on-ac)}
 .main #run:disabled{background:var(--sf);border-color:var(--bd);color:var(--mt)}.main #stop{height:36px}
 .lk{height:auto;border:0;background:none;padding:3px 6px;border-radius:5px;color:var(--ac);font-size:11.5px}.lk:hover{background:var(--ac-sf)}
 .tabs{display:flex;gap:2px;padding:2px;background:var(--sf2);border-radius:8px}
 .tab{flex:1;height:30px;border:0;background:transparent;color:var(--mt);font-size:12px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-weight:600}
 .tab.on,.tab:has(input:checked){background:var(--bg);color:var(--tx);box-shadow:0 1px 2px rgba(16,24,40,.12)}
 .sum{display:block;padding:8px 10px;border-radius:8px;background:var(--sf);color:var(--mt);font-size:12px}.sum:empty{display:none}
 .card{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--bg)}
 .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 10px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:12px;font-weight:600}
 .ch small,.ch em{font-weight:500;color:var(--mt);font-style:normal}.ch .acts{display:flex;gap:2px;flex-wrap:wrap}
 .tools{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--bd)}
 .tools input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;font-size:12px}
 #list,#res{max-height:200px;overflow:auto;padding:2px 0}
 #list label{display:flex;gap:8px;align-items:flex-start;padding:5px 10px;cursor:pointer}#list label:hover{background:var(--sf)}#list label span{flex:1;min-width:0;overflow-wrap:anywhere}
 #res div{padding:3px 10px;font-size:12px;overflow-wrap:anywhere}#res .gh{padding-top:8px}
 input[type=checkbox]{accent-color:var(--ac);width:15px;height:15px;margin:1px 0 0;flex:none}
 input[type=number]{width:64px;height:28px;padding:0 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
 #st{padding:8px 10px;border-radius:8px;background:var(--sf);white-space:pre-wrap}#st:empty{display:none}#st.warn{color:var(--dn);background:var(--dn-sf)}
 #autoInfo{padding:8px 10px;border-radius:8px;background:var(--ok-sf);color:var(--ok);font-size:12px}#autoInfo:empty{display:none}#autoInfo.warn{background:var(--dn-sf);color:var(--dn)}
 #msg{padding:8px 10px;border-radius:8px;background:var(--tx);color:var(--bg);font-weight:600;font-size:12px}#msg:empty{display:none}
 small{color:var(--mt)}.warn{color:var(--dn)}.auto{color:var(--ok)}
 #off{padding:12px;border-radius:10px;background:var(--sf)}
 label{display:flex;gap:8px;align-items:center;cursor:pointer}
 .kv{display:flex;flex-direction:column}
 .kr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-bottom:1px solid var(--bd)}.kr:last-child{border-bottom:0}
 .kr > span:first-child{display:flex;flex-direction:column;min-width:0}.kr > span:first-child small{font-size:11px;line-height:1.3}
 .kr .in{display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;color:var(--mt);font-size:12px}
 .ft{display:flex;gap:8px}.ft button{flex:1}
 ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
</style></head>
<body><main>
 <h1 hidden>⇄ Pasif Servis Taşı <small id="ver"></small></h1>
 <div id="off" hidden class="warn">Bu sekmede panelin <b>/admin/services</b> sayfası açık değil.</div>
 <div id="ui">
  <button id="scan">Pasif servisleri bul</button>
  <small id="stats" class="sum"></small>
  <div class="card" id="selrow" hidden><div class="ch"><span><small id="ptTitle">Not Assigned'a taşınacak</small> <em id="selCount"></em></span><span class="acts"><button class="lk" id="all">Hepsi</button><button class="lk" id="none">Hiçbiri</button><button class="lk" id="cpSel" title="Seçili olanların ID'lerini virgülle kopyala (62727,26272,…)">ID kopyala</button></span></div><div class="tools"><input type="search" id="flt" placeholder="Ara: ad ya da ID" aria-label="Listede ara"><button class="lk" id="inv" title="Seçimi tersine çevir">Ters</button><button class="lk" id="pasteBtn" title="ID listesi yapıştır: yalnız onlar seçilsin">ID yapıştır</button></div><div class="tools" id="pasteRow" hidden><input type="text" id="pasteIn" placeholder="62727,26272,2627 …" aria-label="Seçilecek ID'ler"><button class="lk" id="pasteGo">Seç</button></div><div id="list" hidden></div></div>
  <div class="main"><button id="run" disabled>Taşı (0)</button><button id="stop" disabled>Durdur</button></div>
  <small id="autoInfo" class="auto"></small>
  <div id="st"></div>
  <div id="msg" role="status"></div>
  <div class="card" id="resCard" hidden><div class="ch"><span>Sonuç</span><span class="acts"><button class="lk" id="cpDone" title="Yapılanların ID'lerini virgülle kopyala">Yapılan ID'ler</button><button class="lk" id="cpErr" title="Hatalıların ID'lerini kopyala">Hatalı ID'ler</button></span></div><div id="res" hidden></div></div>
  <div class="card"><div class="ch"><span>Ayarlar</span></div><div class="kv">
   <label class="kr"><span>Pasif kategoriler de<small>Pasif kategorilerdeki pasif servisleri de taşı</small></span><span class="in"><input id="inc" type="checkbox"></span></label>
   <label class="kr"><span>Hedef kategori<small>Boş = Not Assigned</small></span><span class="in"><input id="target" type="text" placeholder="Not Assigned" style="width:150px;height:28px;padding:0 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit"></span></label>
   <label class="kr"><span>Bir seferde</span><span class="in"><input id="batch" type="number" min="1" max="500"> servis</span></label>
   <label class="kr"><span>En çok</span><span class="in"><input id="max" type="number" min="1" max="10000"> servis</span></label>
   <label class="kr"><span>Otomatik mod<small>Sayfayı yenileyip kendiliğinden taşır</small></span><span class="in"><input id="auto" type="checkbox"></span></label>
   <label class="kr"><span>Kaç dakikada bir</span><span class="in"><input id="every" type="number" min="1" max="120"> dk</span></label>
  </div></div>
  <div class="ft"><button id="diag">Teşhisi kopyala</button><button id="log" title="Teşhis + adım günlüğü + sonuçlar">Günlüğü indir (.txt)</button></div>
 </div>
</main><script src="pt.js"></script></body></html>
