<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Servis Pasifle</title>
<style>
 :root{--ac:#1f8a5b;--ink:#16202a;--mut:#5d6b78;--line:#e2e7ec;--bg:#f4f6f9;--card:#fff;--red:#c0324a;--ok:#1f7a45;--warnc:#a34a1a}
 @media (prefers-color-scheme:dark){:root{--ink:#e8edf2;--mut:#9aa7b4;--line:#2a3441;--bg:#121821;--card:#18202b;--red:#f2537d;--ok:#5cc58a;--warnc:#f0a46a}}
 *{box-sizing:border-box}[hidden]{display:none !important}
 body{margin:0;width:auto;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
 main{padding:12px;display:flex;flex-direction:column;gap:10px}
 h1{display:flex;align-items:center;gap:8px;font-size:15px;margin:0;font-weight:650}
 h1 small{margin-left:auto;font-weight:500;font-size:11px}
 #ui{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
 #ui[hidden]{display:none}
 .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 button{cursor:pointer;border:0;border-radius:8px;height:32px;padding:0 13px;background:var(--ac);color:#fff;font:600 12.5px system-ui,sans-serif}
 button:hover{filter:brightness(1.08)}button:disabled{opacity:.38;cursor:default;filter:none}
 button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
 #run{background:var(--red)}
 #stop,#diag{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}#stop:hover,#diag:hover{background:var(--bg)}

 .lk{background:none;height:auto;padding:0 4px;color:var(--ac);font-size:12px}
 .tabs{display:flex;gap:3px;padding:3px;background:var(--bg);border-radius:10px}
 .tab{flex:1;height:30px;background:transparent;color:var(--mut);font-size:12px}.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
 #list,#res,#hist{max-height:180px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:4px 8px}
 #list label,#res div,#hist div{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}#list label:last-child,#res div:last-child{border-bottom:0}#list label span{flex:1;min-width:0;overflow-wrap:anywhere}
 input[type=checkbox]{accent-color:var(--ac);width:15px;height:15px;margin:0}
 input[type=number]{width:62px;height:28px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:0 6px;font:inherit}
 #st{white-space:pre-wrap;padding:8px 10px;border-radius:9px;background:var(--bg)}#st:empty{display:none}
 small{color:var(--mut)}.warn{color:var(--red)}#st.warn{background:color-mix(in srgb,var(--red) 10%,var(--card))}
 #off{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
 label{display:flex;gap:6px;align-items:center;cursor:pointer}
 .auto{color:var(--ok)}
 ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;background:color-mix(in srgb,var(--line) 35%,var(--card));border-bottom:1px solid var(--line);font-size:11.5px;font-weight:650;color:var(--mut)}
 .ch .acts{display:flex;gap:2px}.ch .lk{border-radius:6px;padding:2px 6px}.ch .lk:hover{background:var(--card)}
 .card #list,.card #res{border:0;border-radius:0;background:var(--card);max-height:190px}
 .main{display:flex;gap:8px}.main #run{flex:1;height:36px}
 #scan{width:100%;height:36px}
 .kv{display:flex;flex-direction:column}
 .kr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}.kr:last-child{border-bottom:0}
 .kr > span:first-child{display:flex;flex-direction:column;min-width:0}.kr > span:first-child small{font-size:11px;line-height:1.3}
 .kr .in{display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;color:var(--mut);font-size:11.5px}
 .ft{display:flex;gap:8px}.ft button{flex:1;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.ft button:hover{background:var(--card)}
 #res .gh{display:flex;justify-content:space-between;align-items:center;border-bottom:0;padding-top:6px}
 .sum{display:block;padding:7px 10px;border-radius:9px;background:color-mix(in srgb,var(--ac) 8%,var(--card));font-size:12px}.sum:empty{display:none}
 #autoInfo{padding:7px 10px;border-radius:9px;background:color-mix(in srgb,var(--ok) 10%,var(--card))}#autoInfo:empty{display:none}
 #msg{padding:6px 10px;border-radius:9px;background:var(--ink);color:var(--card);font-weight:600;font-size:12px}#msg:empty{display:none}
 #ui{gap:10px;background:transparent;border:0;padding:0}
 .tab:has(input:checked){background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
 .tab{display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600}
</style></head>
<body><main>
 <h1 hidden>⊘ Servis Pasifle <small id="ver"></small></h1>
 <div id="off" hidden class="warn">Bu sekmede panelin <b>/admin/services</b> sayfası açık değil.</div>
 <div id="ui">
  <div class="tabs"><label class="tab"><input type="radio" name="m" id="mMass" hidden> Toplu</label><label class="tab"><input type="radio" name="m" id="mSingle" hidden> Tek tek</label></div>
  <button id="scan">Not Assigned'daki aktif servisleri bul</button>
  <small id="stats" class="sum"></small>
  <div class="card" id="selrow" hidden><div class="ch"><span><small>Pasife alınacak</small> <em id="selCount"></em></span><span class="acts"><button class="lk" id="all">hepsi</button><button class="lk" id="none">hiçbiri</button><button class="lk" id="cpSel" title="Seçili olanların ID'lerini virgülle kopyala (62727,26272,…)">⧉ ID'ler</button></span></div><div id="list" hidden></div></div>
  <div class="main"><button id="run" disabled>Pasife al (0)</button><button id="stop" disabled>Durdur</button></div>
  <small id="autoInfo" class="auto"></small>
  <div id="st"></div>
  <div id="msg" role="status"></div>
  <div class="card" id="resCard" hidden><div class="ch"><span>Sonuç</span><span class="acts"><button class="lk" id="cpDone" title="Yapılanların ID'lerini virgülle kopyala">⧉ yapılan ID'ler</button><button class="lk" id="cpErr" title="Hatalıların ID'lerini kopyala">⧉ hatalı ID'ler</button></span></div><div id="res" hidden></div></div>
  <div class="card"><div class="ch"><span>Ayarlar</span></div><div class="kv">
   <label class="kr"><span>Deneme modu<small>Açıkken hiçbir servis pasife alınmaz</small></span><span class="in"><input id="dry" type="checkbox"></span></label>
   <label class="kr"><span>En çok</span><span class="in"><input id="max" type="number" min="1" max="5000"> servis</span></label>
   <label class="kr"><span>Otomatik mod<small>Sayfayı yenileyip kendiliğinden kontrol eder</small></span><span class="in"><input id="auto" type="checkbox"></span></label>
   <label class="kr"><span>Kaç dakikada bir</span><span class="in"><input id="every" type="number" min="1" max="120"> dk</span></label>
  </div></div>
  <div class="ft"><button id="diag">Teşhisi kopyala</button><button id="log" title="Teşhis + adım günlüğü + sonuçlar">⬇ Günlük (.txt)</button></div>
 </div>
</main><script src="sp.js"></script></body></html>
