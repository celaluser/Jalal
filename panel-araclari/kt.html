<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Kategori Temizle</title>
<style>
 body{margin:0;width:auto;font:13px/1.4 system-ui,sans-serif;background:#1b2130;color:#e8ecf4}
 main{padding:10px;display:flex;flex-direction:column;gap:8px}
 h1{font-size:14px;margin:0}
 .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 button{cursor:pointer;border:0;border-radius:6px;padding:6px 10px;background:#2d3a5c;color:#fff;font:inherit}
 button:hover{background:#3a4a74}button:disabled{opacity:.4;cursor:default}
 #run{background:#9b2c3a}#run:hover{background:#b73646}
 .tabs{display:flex;gap:4px}.tab{flex:1;background:#121724;color:#aab4cc;font-size:12px;padding:5px}.tab.on{background:#3a4a74;color:#fff}
 .lk{background:none;color:#8fb0ff;padding:0 4px;font-size:12px}
 #list,#res{max-height:170px;overflow:auto;background:#121724;border-radius:6px;padding:4px 6px}
 #list label,#res div{display:flex;gap:4px;padding:1px 0;border-bottom:1px solid #1f2740}#list label span{flex:1}
 input[type=number]{width:56px;background:#121724;color:#fff;border:1px solid #3a4560;border-radius:4px;padding:2px 4px}
 #st{white-space:pre-wrap;color:#c9d2e8}small{color:#8f9bb8}.warn{color:#ffb4a8}
 label{display:flex;gap:4px;align-items:center}
</style></head>
<body><main>
 <h1>🗑 Kategori Temizle <small id="ver"></small></h1>
 <div id="off" hidden class="warn">Bu sekmede panelin <b>/admin/services</b> sayfası açık değil.</div>
 <div id="ui">
  <div class="tabs"><button class="tab" id="mDel">Boş kategori sil</button><button class="tab" id="mMove">Pasif → Not Assigned</button></div>
  <div class="row" style="margin-top:6px"><button id="scan">Bul</button></div>
  <small id="stats"></small>
  <div class="row" id="selrow" hidden><small id="listTitle"></small><button class="lk" id="all">hepsi</button><button class="lk" id="none">hiçbiri</button></div>
  <div id="list" hidden></div>
  <div class="row" id="mdRow" hidden><label><input id="moveDelete" type="checkbox"> Taşıdıktan sonra boş kategoriyi sil</label></div>
  <div class="row"><button id="run" disabled>Sil (0)</button><button id="stop" disabled>Durdur</button></div>
  <div class="row"><label><input id="dry" type="checkbox"> Deneme modu</label><label>en çok <input id="max" type="number" min="1" max="1000"></label></div>
  <div id="st"></div>
  <div id="res" hidden></div>
  <div class="row"><button id="diag">Teşhisi kopyala</button></div>
 </div>
</main><script src="kt.js"></script></body></html>
